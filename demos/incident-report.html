<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>SMS Broadcast</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
  /* Layout: one centered compose form, narrow column, counter and recipient line under the textarea. */
  :root {
    --bg: #f4f6f8;
    --surface: #ffffff;
    --fg: #14202b;
    --muted: #5a6b7a;
    --line: #cfd8e0;
    --accent: #0b6fa4;
    --accent-fg: #ffffff;
    --warn: #a94b06;
    --danger: #b42318;
    --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f161d;
      --surface: #18212b;
      --fg: #e8eef3;
      --muted: #93a3b2;
      --line: #2e3c4a;
      --accent: #4aa8dc;
      --accent-fg: #06202f;
      --warn: #e9a23b;
      --danger: #f08a80;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f161d;
    --surface: #18212b;
    --fg: #e8eef3;
    --muted: #93a3b2;
    --line: #2e3c4a;
    --accent: #4aa8dc;
    --accent-fg: #06202f;
    --warn: #e9a23b;
    --danger: #f08a80;
    color-scheme: dark;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 1rem;
    line-height: 1.5;
    padding-block: 2.5rem;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  main {
    max-width: 32rem;
    margin-inline: auto;
    min-width: 0;
  }

  h1 {
    font-size: 1.375rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 1.25rem;
    text-wrap: balance;
  }

  form {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  label {
    font-size: 0.8125rem;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  textarea {
    width: 100%;
    min-height: 9rem;
    resize: vertical;
    font: inherit;
    color: var(--fg);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 0.75rem;
  }
  textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    border-color: var(--accent);
  }

  .meta {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 0.25rem 1rem;
    font-size: 0.875rem;
    color: var(--muted);
  }
  .meta > * { min-width: 0; }

  #counter { font-variant-numeric: tabular-nums; }
  #counter.low { color: var(--warn); }
  #counter.none { color: var(--danger); font-weight: 600; }

  #recipients strong { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }

  button {
    align-self: flex-start;
    font: inherit;
    font-weight: 600;
    color: var(--accent-fg);
    background: var(--accent);
    border: 0;
    border-radius: 6px;
    padding: 0.625rem 1.25rem;
    cursor: pointer;
  }
  button:hover:not(:disabled) { filter: brightness(1.08); }
  button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }

  #status {
    margin: 0;
    min-height: 1.5em;
    font-size: 0.875rem;
    color: var(--muted);
  }

  @media (prefers-reduced-motion: no-preference) {
    button { transition: filter 0.15s ease; }
  }
</style>

<main>
  <h1>SMS incident report</h1>
  <form id="compose" novalidate>
    <label for="message">Message</label>
    <textarea id="message" maxlength="160" placeholder="Type your message here"></textarea>
    <div class="meta">
      <span id="counter">160 characters remaining</span>
      <span id="recipients">This message will go to <strong>27</strong> recipients</span>
    </div>
    <button id="send" type="submit" disabled>Send</button>
    <p id="status" role="status" aria-live="polite"></p>
  </form>
</main>

<script>
  const MAX = 160;
  const RECIPIENTS = 27; // replace with the live count from your backend

  const box = document.getElementById("message");
  const counter = document.getElementById("counter");
  const recipients = document.getElementById("recipients");
  const send = document.getElementById("send");
  const status = document.getElementById("status");
  const form = document.getElementById("compose");

  recipients.innerHTML =
    "This message will go to <strong>" + RECIPIENTS + "</strong> recipient" +
    (RECIPIENTS === 1 ? "" : "s");

  function update() {
    const remaining = MAX - box.value.length;
    counter.textContent = remaining + " character" + (remaining === 1 ? "" : "s") + " remaining";
    counter.className = remaining === 0 ? "none" : remaining <= 20 ? "low" : "";
    send.disabled = box.value.trim().length === 0;
    status.textContent = "";
  }

  box.addEventListener("input", update);

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (box.value.trim().length === 0) return;
    status.textContent =
      "Demo only. Nothing was sent. A real version would send this to " +
      RECIPIENTS + " recipients.";
  });

  update();
</script>

</body></html>
